- name: system setup | rules | PERSONAL | Deny PERSONAL to pfSenseAdmin
  tags: system,system-setup,rules,rules-personal
  pfsensible.core.pfsense_rule:
    action: block
    disabled: false
    interface: PERSONAL
    ipprotocol: inet
    protocol: tcp/udp
    source: NET:PERSONAL
    destination: (self)
    destination_port: pfSenseAdmin
    name: Deny PERSONAL to pfSenseAdmin

- name: system setup | rules | PERSONAL | Allow traffic inside PERSONAL
  tags: system,system-setup,rules,rules-personal
  pfsensible.core.pfsense_rule:
    action: pass
    disabled: false
    interface: PERSONAL
    ipprotocol: inet
    protocol: any
    source: NET:PERSONAL
    destination: NET:PERSONAL
    name: Allow traffic inside PERSONAL
    after: Deny PERSONAL to pfSenseAdmin

- name: system setup | rules | PERSONAL | Allow PERSONAL to IOT
