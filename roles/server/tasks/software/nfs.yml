- name: software | nfs-kernel-server | install package
  tags: packages,nfs,server-packages
  package:
    name: nfs-kernel-server
    state: present
  when: nfs_kernel_server is defined and nfs_kernel_server == true

- name: software | nfs-common | install package
  tags: packages,nfs,server-packages
  package:
    name: nfs-common
    state: present
  when: nfs_common is defined and nfs_common == true