- hosts: server:workstation
  become: true
  pre_tasks:

- hosts: OPNsense_firewall
  connection: local
  gather_facts: false
  module_defaults:
    group/oxlorg.opnsense.all:
        firewall: '{{ ansible_host }}'
        api_credential_file: '~/.opn_key'
        ssl_verify: false
  roles:
    - OPNsense

- hosts: pfSense_firewall
  roles:
    - pfSense

- hosts: server
  become: true
  roles:
    - base
    - server

- hosts: workstation
  become: true
  roles:
    - base
    - workstation
